name: openmuse
services:
  browser-worker:
    build:
      context: ../apps/worker
    init: true
    restart: unless-stopped
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN to a random secret of at least 32 characters}
      # browser_task (Jev) runs in the worker and needs the Impossibl key.
      IMPOSSIBL_API_KEY: ${IMPOSSIBL_API_KEY:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.impossibl.com}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      JEV_TYPE_MODEL: ${JEV_TYPE_MODEL:-zai/glm-5.3-flash}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-America/Sao_Paulo}
      WORKER_LOCALE: ${WORKER_LOCALE:-pt-BR}
      WORKER_MAX_PROFILES: ${WORKER_MAX_PROFILES:-60}
      CHECKOUT_MERCHANTS: ${CHECKOUT_MERCHANTS:-ifood.com.br,mercadolivre.com.br,mercadolivre.com}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - browser-profiles:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  browser-profiles:
